# Your outreach message — this file was copied into ~/.coldtrail/message.toml.
# It is yours to edit; coldtrail never overwrites it. Keep your name, pitch, and
# link here — they stay LOCAL. Placeholders {company} and {fn} (first name) are
# filled per contact; {slug} in `link` becomes a per-company utm_content value so
# you can attribute clicks. Keep it short, human, and honest.

# Your call-to-action link. Point it wherever you want; keep the {slug} so each
# send gets its own utm_content. (Default points at Canonical, which sources the list.)
link = "https://trycanonical.ai/?utm_source=outreach&utm_medium=email&utm_campaign=design_partner&utm_content={slug}"

subject = "found {company} while testing Canonical"

# Each item is one paragraph. Use "__CTA__" where the call-to-action should go.
paragraphs = [
    "Hi {fn},",
    "Fun way to find you: I described my ideal customers in plain English to Canonical and it returned {company} in a verified, domain-keyed shortlist.",
    "Canonical is a company-search tool — describe the companies you want in plain English and get back a verified list, including the long-tail accounts standard databases miss.",
    "I'm taking on a few design partners: generous free credits, a direct line to me, and real input on the roadmap.",
    "__CTA__",
    "— Your Name",
]

cta_plain = "Feel free to explore on your own at trycanonical.ai — no need to book a demo."
cta_html = "Feel free to explore on your own at <a href=\"{link}\">trycanonical.ai</a> — no need to book a demo."
