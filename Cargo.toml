[package]
name = "coldtrail"
version = "0.8.1"
edition = "2021"
description = "Discovery-first, deduped outreach — drafts you send by hand."
license = "MIT"

[[bin]]
name = "coldtrail"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.19"
hickory-resolver = "0.24"
regex = "1"
anyhow = "1"
dirs = "5"
rpassword = "7"
urlencoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "sync", "net", "signal"] }
axum = "0.7"
tower = "0.5"
rust-embed = "8"
open = "5"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
tokio-stream = "0.1"
base64 = "0.22"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "0.26"

[profile.release]
strip = true
opt-level = "z"
lto = true
